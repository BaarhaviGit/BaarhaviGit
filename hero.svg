<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0b1026"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="0" y="0" width="900" height="240" rx="18" fill="url(#bg)"/>

  <!-- leading comment -->
  <text x="30" y="38" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#8b949e">// hello_world.ts</text>

  <!-- ASCII banner: HELLO WORLD -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="23" font-weight="700" fill="#e6edf3" text-anchor="middle">
    <text x="450" y="58">#   # ##### #     #      ###   #   #  ###  ####  #     #### </text>
    <text x="450" y="85">#   # #     #     #     #   #  #   # #   # #   # #     #   #</text>
    <text x="450" y="112">##### ####  #     #     #   #  # # # #   # ####  #     #   #</text>
    <text x="450" y="139">#   # #     #     #     #   #  # # # #   # #  #  #     #   #</text>
    <text x="450" y="166">#   # ##### ##### #####  ###   #   #  ###  #   # ##### #### </text>
  </g>

  <!-- caption -->
  <text x="450" y="205" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#8b949e" text-anchor="middle">← the classic hello world of every developer</text>
</svg>