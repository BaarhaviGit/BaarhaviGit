<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0b1026"/>
    </linearGradient>
  </defs>

  <!-- terminal window -->
  <rect x="0" y="0" width="900" height="240" rx="18" fill="url(#bg)"/>

  <!-- title bar -->
  <rect x="0" y="0" width="900" height="38" rx="18" fill="#161b22"/>
  <rect x="0" y="20" width="900" height="18" fill="#161b22"/>

  <!-- traffic lights -->
  <circle cx="30" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="19" r="6" fill="#27c93f"/>

  <!-- window title -->
  <text x="450" y="25" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b949e">debugmate ~/profile.sh</text>

  <!-- terminal body (monospace, dev only) -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="17">
    <!-- $ whoami -->
    <text x="30" y="66" fill="#8b949e">$</text>
    <text x="48" y="66" fill="#e6edf3">whoami</text>

    <!-- output -->
    <text x="58" y="90" fill="#a5b4fc">baarhavi — full-stack developer</text>

    <!-- $ ls -->
    <text x="30" y="114" fill="#8b949e">$</text>
    <text x="48" y="114" fill="#e6edf3">ls ./stack</text>
    <text x="58" y="138" fill="#e6edf3">react · node · aws · firebase · mongodb · docker</text>

    <!-- $ npm run build -->
    <text x="30" y="162" fill="#8b949e">$</text>
    <text x="48" y="162" fill="#e6edf3">npm run build</text>
    <text x="58" y="186" fill="#7ee787">✓ compiled successfully</text>

    <!-- $ echo -->
    <text x="30" y="210" fill="#8b949e">$</text>
    <text x="48" y="210" fill="#e6edf3">echo "always building, never bored"</text>
    <text x="58" y="228" fill="#e6edf3">always building, never bored</text>

    <!-- blinking caret -->
    <rect x="30" y="220" width="9" height="18" rx="2" fill="#e6edf3">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>