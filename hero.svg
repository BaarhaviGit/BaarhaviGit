<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0a22"/>
      <stop offset="55%" stop-color="#1b1440"/>
      <stop offset="100%" stop-color="#0b1026"/>
    </linearGradient>

    <linearGradient id="gradName" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6">
        <animate attributeName="stop-color"
                 values="#8b5cf6;#6366f1;#3b82f6;#06b6d4;#10b981;#ec4899;#8b5cf6"
                 dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#6366f1">
        <animate attributeName="stop-color"
                 values="#6366f1;#3b82f6;#06b6d4;#ec4899;#8b5cf6;#10b981;#6366f1"
                 dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3b82f6">
        <animate attributeName="stop-color"
                 values="#3b82f6;#06b6d4;#10b981;#8b5cf6;#6366f1;#ec4899;#3b82f6"
                 dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="blobViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#a5b4fc" opacity="0.14"/>
    </pattern>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background card -->
  <rect x="0" y="0" width="900" height="240" rx="22" fill="url(#bg)"/>
  <rect x="0" y="0" width="900" height="240" rx="22" fill="url(#dots)"/>

  <!-- floating gradient blobs -->
  <circle cx="120" cy="70" r="140" fill="url(#blobViolet)">
    <animate attributeName="cx" values="120;210;150;70;120" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="70;110;50;20;70" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="170" r="150" fill="url(#blobCyan)">
    <animate attributeName="cx" values="760;650;800;690;760" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="170;120;200;140;170" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="40" r="110" fill="url(#blobPink)">
    <animate attributeName="cx" values="620;700;560;660;620" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="40;90;10;70;40" dur="13s" repeatCount="indefinite"/>
  </circle>

  <!-- dev glyph -->
  <text x="52" y="58" font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="700" fill="#a5b4fc" opacity="0.9">&lt;/&gt;</text>

  <!-- name glow layer -->
  <text x="450" y="122" text-anchor="middle" font-family="Poppins, 'Segoe UI', -apple-system, sans-serif" font-size="66" font-weight="800" letter-spacing="2" fill="#8b5cf6" opacity="0.55" filter="url(#glow)">Baarhavi</text>

  <!-- animated gradient name -->
  <text x="450" y="122" text-anchor="middle" font-family="Poppins, 'Segoe UI', -apple-system, sans-serif" font-size="66" font-weight="800" letter-spacing="2" fill="url(#gradName)">Baarhavi</text>

  <!-- subtitle -->
  <text x="450" y="168" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="600" letter-spacing="7" fill="#a5b4fc" opacity="0.95">FULL-STACK DEVELOPER • OPEN SOURCE LEARNER</text>

  <!-- blinking cursor -->
  <rect x="450" y="180" width="9" height="3" rx="1.5" fill="#8b5cf6">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- twinkling sparkles -->
  <g fill="#e0e7ff">
    <text x="70" y="190" font-size="14">
      +
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.4s" repeatCount="indefinite" begin="0.2s"/>
    </text>
    <text x="830" y="80" font-size="14">
      +
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.7s" repeatCount="indefinite" begin="1.1s"/>
    </text>
    <text x="820" y="205" font-size="11">
      +
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.1s" repeatCount="indefinite" begin="0.7s"/>
    </text>
    <text x="120" y="60" font-size="11">
      +
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3s" repeatCount="indefinite" begin="1.6s"/>
    </text>
  </g>
</svg>